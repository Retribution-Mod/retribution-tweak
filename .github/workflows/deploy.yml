name: Deploy
run-name: ${{ github.event.inputs.release == 'true' && 'Release' || 'Build' }} for ${{ github.event.inputs.ipa_url_old && github.event.inputs.ipa_url_new && 'old + new' || github.event.inputs.ipa_url_old && 'old' || 'new' }}

on:
   workflow_dispatch:
    inputs:
        ipa_url_old:
            description: "Direct link to the decrypted IPA for Discord 340.x (old arch)"
            default: "https://i.allyapp.cc/raw/com.hammerandchisel.discord_340.0_und3fined.ipa"
            required: false
            type: string
        ipa_url_new:
            description: "Direct link to the decrypted IPA for Discord 341.x+ (new arch)"
            default: "https://i.allyapp.cc/raw/com.hammerandchisel.discord_341.0_und3fined.ipa"
            required: false
            type: string
        release:
            description: 'Release the build'
            required: true
            type: boolean

env:
  GH_TOKEN: ${{ github.token }}
  ICON_URL: https://i.allyapp.cc/raw/Tb28xxWC.png


jobs:
  build-tweak:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@4e23d15886bca77b5f7c462a82567e0de33ebe0b # v1

      - name: Set GNU Make path
        run: |
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Build packages
        run: make package FINALPACKAGE=1 && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Set DEB path
        run: |
          echo "DEB_PATH=${{ github.workspace }}/packages/*-arm.deb" >> $GITHUB_ENV
          echo "ROOTLESS_DEB_PATH=${{ github.workspace }}/packages/*-arm64.deb" >> $GITHUB_ENV

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ env.DEB_PATH }}

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: rootless package
          path: ${{ env.ROOTLESS_DEB_PATH }}

  build-ipa:
    runs-on: macos-14
    needs: build-tweak
    strategy:
      matrix:
        include:
          - variant: old
            ipa_url: ${{ github.event.inputs.ipa_url_old }}
          - variant: new
            ipa_url: ${{ github.event.inputs.ipa_url_new }}

    steps:
      - name: Skip if no URL for this variant
        if: ${{ matrix.ipa_url == '' }}
        run: echo "No IPA URL provided for ${{ matrix.variant }} variant, skipping" && exit 0

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Download Discord IPA
        run: |
          curl -L -o discord.ipa "${{ matrix.ipa_url }}"

      - name: Create IPA icons
        run: |
          mkdir -p icons
          curl -L -o icon.png "$ICON_URL"
          sips -Z 120 icon.png --out icon-120.png
          sips -p 120 120 --padColor 000000 icon-120.png --out icons/RetributionIcon60x60@2x.png
          sips -Z 152 icon.png --out icon-152.png
          sips -p 152 152 --padColor 000000 icon-152.png --out icons/RetributionIcon76x76@2x~ipad.png
          zip -j ipa-icons.zip icons/*

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' control | cut -d ' ' -f 2)
          DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm.deb"
          echo "DEB_FILE_NAME=$DEB_FILE_NAME" >> $GITHUB_ENV
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Run patcher
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            PATCHER_URL="https://github.com/Retribution-Mod/retribution-patcher/releases/download/v1.0.0/retribution-patcher-mac-arm64"
          else
            PATCHER_URL="https://github.com/Retribution-Mod/retribution-patcher/releases/download/v1.0.0/retribution-patcher-mac-amd64"
          fi
          curl -L -o patcher "$PATCHER_URL"
          chmod +x patcher
          ./patcher --icon-zip ./ipa-icons.zip --name "Retribution" --output discord.ipa discord.ipa

      - name: Install cyan
        run: pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip Pillow

      - name: Inject tweak
        run: |
          cyan -duws -i discord.ipa -o ${{ github.workspace }}/${{ env.APP_NAME }}.ipa \
            -l ${{ github.workspace }}/RetributionInfo.plist \
            -x ${{ github.workspace }}/Retribution.entitlements \
            -f ${{ github.workspace }}/${{ env.DEB_FILE_NAME }}

      - name: Extract Discord version
        run: |
          unzip -q ${{ env.APP_NAME }}.ipa
          DISCORD_VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)
          echo "DISCORD_VERSION=$DISCORD_VERSION" >> $GITHUB_ENV

      - name: Upload ipa as artifact
        uses: actions/upload-artifact@v4
        with:
            name: ipa-${{ matrix.variant }}
            path: ${{ github.workspace }}/${{ env.APP_NAME }}.ipa

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
            name: version-${{ matrix.variant }}
            path: ${{ github.workspace }}/Payload/Discord.app/Info.plist

  release-app:
    if: ${{ github.event.inputs.release == 'true' }}
    runs-on: macos-14
    needs: build-ipa
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' control | cut -d ' ' -f 2)
          DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm.deb"
          echo "DEB_FILE_NAME=$DEB_FILE_NAME" >> $GITHUB_ENV
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Read Discord versions from artifacts
        run: |
          OLD_PLIST=$(find version-old -name Info.plist | head -n 1)
          NEW_PLIST=$(find version-new -name Info.plist | head -n 1)
          OLD_VERSION=$(plutil -p "$OLD_PLIST" | grep CFBundleShortVersionString | awk -F '"' '{print $2}' || echo "")
          NEW_VERSION=$(plutil -p "$NEW_PLIST" | grep CFBundleShortVersionString | awk -F '"' '{print $2}' || echo "")
          echo "OLD_VERSION=$OLD_VERSION" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Rename IPAs by variant
        run: |
          if [ -f ipa-old/${{ env.APP_NAME }}.ipa ]; then
            mv ipa-old/${{ env.APP_NAME }}.ipa ${{ env.APP_NAME }}-old.ipa
          fi
          if [ -f ipa-new/${{ env.APP_NAME }}.ipa ]; then
            mv ipa-new/${{ env.APP_NAME }}.ipa ${{ env.APP_NAME }}-new.ipa
          fi

      - name: Create GitHub Release (old)
        if: ${{ env.OLD_VERSION != '' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.OLD_VERSION }}
          files: |
            ${{ env.DEB_FILE_NAME }}
            ${{ env.ROOTLESS_DEB_FILE_NAME }}
            ${{ env.APP_NAME }}-old.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ env.GH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (new)
        if: ${{ env.NEW_VERSION != '' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          files: |
            ${{ env.DEB_FILE_NAME }}
            ${{ env.ROOTLESS_DEB_FILE_NAME }}
            ${{ env.APP_NAME }}-new.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ env.GH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app-repo:
    if: ${{ github.event.inputs.release == 'true' }}
    continue-on-error: true
    runs-on: macos-14
    needs: release-app
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract App Name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Download version artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Read Discord versions
        run: |
          OLD_VERSION=$(plutil -p version-old/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4 || echo "")
          NEW_VERSION=$(plutil -p version-new/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4 || echo "")
          echo "OLD_VERSION=$OLD_VERSION" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Download IPA artifacts
        uses: actions/download-artifact@v4
        with:
          name: ipa-old
          path: ipa-old
        if: ${{ env.OLD_VERSION != '' }}

      - name: Download IPA artifacts (new)
        uses: actions/download-artifact@v4
        with:
          name: ipa-new
          path: ipa-new
        if: ${{ env.NEW_VERSION != '' }}

      - name: Update app-repo.json
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          REPO=${{ github.repository }}

          # Old variant (340.x)
          if [ -n "$OLD_VERSION" ] && [ -f ipa-old/${{ env.APP_NAME }}.ipa ]; then
            IPA_SIZE=$(ls -l ipa-old/${{ env.APP_NAME }}.ipa | awk '{print $5}')
            DOWNLOAD_URL="https://github.com/$REPO/releases/download/v$OLD_VERSION/${{ env.APP_NAME }}-old.ipa"
            NEW_ENTRY=$(jq -n --arg version "$OLD_VERSION" --arg date "$DATE" --arg size "$IPA_SIZE" --arg downloadURL "$DOWNLOAD_URL" '{version: $version, date: $date, size: ($size | tonumber), downloadURL: $downloadURL, label: "old"}')
            jq --argjson newEntry "$NEW_ENTRY" '(.apps[0].versions |= map(select(.label != "old"))) | .apps[0].versions |= [$newEntry] + .' app-repo.json > temp.json && mv temp.json app-repo.json
          fi

          # New variant (341.x+)
          if [ -n "$NEW_VERSION" ] && [ -f ipa-new/${{ env.APP_NAME }}.ipa ]; then
            IPA_SIZE=$(ls -l ipa-new/${{ env.APP_NAME }}.ipa | awk '{print $5}')
            DOWNLOAD_URL="https://github.com/$REPO/releases/download/v$NEW_VERSION/${{ env.APP_NAME }}-new.ipa"
            NEW_ENTRY=$(jq -n --arg version "$NEW_VERSION" --arg date "$DATE" --arg size "$IPA_SIZE" --arg downloadURL "$DOWNLOAD_URL" '{version: $version, date: $date, size: ($size | tonumber), downloadURL: $downloadURL, label: "new"}')
            jq --argjson newEntry "$NEW_ENTRY" '(.apps[0].versions |= map(select(.label != "new"))) | .apps[0].versions |= [$newEntry] + .' app-repo.json > temp.json && mv temp.json app-repo.json
          fi

      - uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          default_author: github_actions
          message: "chore: update app-repo.json"
          add: app-repo.json
