name: Deploy
run-name: ${{ github.event.inputs.release == 'true' && 'Release' || 'Build' }} for ${{ github.event.inputs.ipa_url }}

on:
   workflow_dispatch:
    inputs:
        ipa_url:
            description: "Direct link to the decrypted IPA for Discord 341.x+"
            default: "https://i.allyapp.cc/raw/com.hammerandchisel.discord_341.0_und3fined.ipa"
            required: false
            type: string
        release:
            description: 'Release the build'
            required: true
            type: boolean

env:
  GH_TOKEN: ${{ github.token }}
  ICON_URL: https://i.allyapp.cc/raw/Tb28xxWC.png


jobs:
  build-tweak:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@4e23d15886bca77b5f7c462a82567e0de33ebe0b # v1

      - name: Set GNU Make path
        run: |
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Build packages
        run: make package FINALPACKAGE=1 && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Set DEB path
        run: |
          echo "DEB_PATH=${{ github.workspace }}/packages/*-arm.deb" >> $GITHUB_ENV
          echo "ROOTLESS_DEB_PATH=${{ github.workspace }}/packages/*-arm64.deb" >> $GITHUB_ENV

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ env.DEB_PATH }}

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: rootless package
          path: ${{ env.ROOTLESS_DEB_PATH }}

  build-ipa:
    runs-on: macos-14
    needs: build-tweak

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Download Discord IPA
        run: |
          curl -L -o discord.ipa "${{ github.event.inputs.ipa_url || inputs.ipa_url }}"

      - name: Create IPA icons
        run: |
          mkdir -p icons
          curl -L -o icon.png "$ICON_URL"
          sips -Z 120 icon.png --out icon-120.png
          sips -p 120 120 --padColor 000000 icon-120.png --out icons/RetributionIcon60x60@2x.png
          sips -Z 152 icon.png --out icon-152.png
          sips -p 152 152 --padColor 000000 icon-152.png --out icons/RetributionIcon76x76@2x~ipad.png
          zip -j ipa-icons.zip icons/*

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' control | cut -d ' ' -f 2)
          DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm.deb"
          echo "DEB_FILE_NAME=$DEB_FILE_NAME" >> $GITHUB_ENV
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Run patcher
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            PATCHER_URL="https://github.com/Retribution-Mod/retribution-patcher/releases/download/v1.0.0/retribution-patcher-mac-arm64"
          else
            PATCHER_URL="https://github.com/Retribution-Mod/retribution-patcher/releases/download/v1.0.0/retribution-patcher-mac-amd64"
          fi
          curl -L -o patcher "$PATCHER_URL"
          chmod +x patcher
          ./patcher --icon-zip ./ipa-icons.zip --name "Retribution" --output discord.ipa discord.ipa

      - name: Install cyan
        run: pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip Pillow

      - name: Inject tweak
        run: |
          cyan -duws -i discord.ipa -o ${{ github.workspace }}/${{ env.APP_NAME }}.ipa \
            -l ${{ github.workspace }}/RetributionInfo.plist \
            -x ${{ github.workspace }}/Retribution.entitlements \
            -f ${{ github.workspace }}/${{ env.DEB_FILE_NAME }}

      - name: Extract Discord version
        run: |
          unzip -q ${{ env.APP_NAME }}.ipa
          DISCORD_VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)
          echo "DISCORD_VERSION=$DISCORD_VERSION" >> $GITHUB_ENV

      - name: Upload ipa as artifact
        uses: actions/upload-artifact@v4
        with:
            name: ipa
            path: ${{ github.workspace }}/${{ env.APP_NAME }}.ipa

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
            name: version
            path: ${{ github.workspace }}/Payload/Discord.app/Info.plist

  release-app:
    if: ${{ github.event.inputs.release == 'true' }}
    runs-on: macos-14
    needs: build-ipa
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' control | cut -d ' ' -f 2)
          DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm.deb"
          echo "DEB_FILE_NAME=$DEB_FILE_NAME" >> $GITHUB_ENV
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Flatten downloaded packages
        run: |
          mv package/* . 2>/dev/null || true
          mv "rootless package"/* . 2>/dev/null || true

      - name: Read Discord version from artifacts
        run: |
          PLIST=$(find version -name Info.plist | head -n 1)
          DISCORD_VERSION=$(plutil -p "$PLIST" | grep CFBundleShortVersionString | cut -d '"' -f 4)
          echo "DISCORD_VERSION=$DISCORD_VERSION" >> $GITHUB_ENV

      - name: Rename IPA
        run: |
          if [ -f ipa/${{ env.APP_NAME }}.ipa ]; then
            mv ipa/${{ env.APP_NAME }}.ipa ${{ env.APP_NAME }}.ipa
          fi

      - name: Delete previous releases and tags
        run: |
          gh release list --json tagName -q '.[].tagName' | while IFS= read -r tag; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.DISCORD_VERSION }}
          files: |
            ${{ env.DEB_FILE_NAME }}
            ${{ env.ROOTLESS_DEB_FILE_NAME }}
            ${{ env.APP_NAME }}.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ env.GH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app-repo:
    if: ${{ github.event.inputs.release == 'true' }}
    continue-on-error: true
    runs-on: macos-14
    needs: release-app
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract App Name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Download version artifact
        uses: actions/download-artifact@v4
        with:
          name: version

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ipa

      - name: Read Discord version
        run: |
          PLIST=$(find . -name Info.plist | head -n 1)
          VERSION=$(plutil -p "$PLIST" | grep CFBundleShortVersionString | cut -d '"' -f 4)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update app-repo.json
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          REPO=${{ github.repository }}
          IPA_SIZE=$(ls -l ${{ env.APP_NAME }}.ipa | awk '{print $5}')
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/v$VERSION/${{ env.APP_NAME }}.ipa"
          NEW_ENTRY=$(jq -n --arg version "$VERSION" --arg date "$DATE" --arg size "$IPA_SIZE" --arg downloadURL "$DOWNLOAD_URL" '{version: $version, date: $date, size: ($size | tonumber), downloadURL: $downloadURL, label: "new"}')
          jq --argjson newEntry "$NEW_ENTRY" '.apps[0].versions = [$newEntry]' app-repo.json > temp.json && mv temp.json app-repo.json

      - uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          default_author: github_actions
          message: "chore: update app-repo.json"
          add: app-repo.json
